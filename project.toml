# Project settings. Written by `/kickoff` (via tools/init_project.py) and `/architecture`.
# Scripts read this file: keep keys in English.

[project]
initialized = true          # set to true by tools/init_project.py
origin = "greenfield"        # greenfield | brownfield (existing codebase, set by tools/adopt.py)
name = "Agentic Portal"
description = "Local developer-experience portal on top of the agentic-skeleton workflow: state, plan, backlog, agent runs, human gates and codebase health."
id_prefix = "AP"             # story IDs: <prefix><epic 2 digits><story 2 digits>, e.g. PR0101
language = "en"              # language of artifact content (templates/headings stay English)
owner = "Alberto Galimberti"                   # product owner / approver, recorded in approvals
tracker = "local"            # local | <adapter name>; see tools/README.md "Tracker adapters"

[inception]
mockup = true                # include the /mockup step in the lifecycle
sources = []                 # kickoff sources (brief, transcripts, notes): read by steps with `sources = true`
design = ""                  # existing design or prototype: /mockup maps it instead of building a new one

[portal]
# Agentic portal, started by `make portal` (tools/portal.py). Uncomment to pin a release:
# version = "x.y.z"
# source = "<owner>/<repo>"     # optional, GitHub repository hosting the release bundle
# Skeleton the contract tests run against (same value as the CI variable SKELETON_PIN): tag v1.3.0 is
# pending upstream, so it is the commit that ships the eight --json emitters (skeleton 1.3.0, contract 1.0).
skeleton_pin = "d00c402bcac1b76d5adf5557359d1bbdee22a54d"

[stack]
# Filled by /architecture once the ADRs are approved. Used by Makefile targets setup / test / lint / run.
decided = true
summary = "Local web app: Python >=3.14 stdlib server (server/) + React/Vite/TypeScript static bundle (web/); skeleton tools via versioned JSON contract; SSE; .portal/ state. See reference/architecture/."
setup = "npm --prefix web ci"
test = "${PY:-python3} -m unittest discover -s server/tests -q && ${PY:-python3} scripts/check_deps.py server && ${PY:-python3} -m unittest discover -s scripts/tests -q && npm --prefix web test -- --run"
lint = "${PY:-python3} -m compileall -q server scripts && npm --prefix web run lint && npm --prefix web run typecheck"
run = "npm --prefix web run build && cd server && ${PY:-python3.14} -m portal_server"
url = "http://127.0.0.1:8765"
