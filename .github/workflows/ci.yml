name: portal-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make setup
      - run: make lint
      - run: npm --prefix web run build
      - run: make test
      - run: python scripts/build_bundle.py --out release
      - name: SHA-256
        run: sha256sum release/*.zip | tee release/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: portal-bundle
          path: release/

  contract:
    # The portal's contract client against the real skeleton at the pin (project.toml [portal] skeleton_pin).
    needs: full
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: albegali/agentic-skeleton
          ref: ${{ vars.SKELETON_PIN || 'v1.3.0' }}
          path: skeleton
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install jsonschema
      - name: Contract tests against the skeleton at the pin
        run: python -m unittest tests.test_contract_fixtures -v
        working-directory: server
        env:
          SKELETON_DIR: ${{ github.workspace }}/skeleton
          WF_REQUIRE_JSONSCHEMA: "1"

  e2e:
    needs: full
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npx --prefix web playwright install --with-deps chromium webkit firefox
      - name: Accessibility and keyboard e2e (axe, 3 engines)
        run: npm --prefix web run e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/

  cross-platform:
    needs: full
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - name: Server tests
        run: python -m unittest discover -s server/tests -q
      - name: Bundle smoke test
        run: python -m unittest discover -s scripts/tests -q
