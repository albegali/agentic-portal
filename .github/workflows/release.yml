name: portal-release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Tag must match VERSION
        run: test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"
      - run: make setup
      - run: make lint
      - run: npm --prefix web run build
      - run: make test
      - run: python scripts/build_bundle.py --out release
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/*.zip release/manifest.json --title "${GITHUB_REF_NAME}" --generate-notes
