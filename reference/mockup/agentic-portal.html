<style>
body{margin:0}
.app a{color:#9AA3B2}
body{margin:0}
a{color:#9AA3B2}a:hover{color:#E7E9EE}
.app{--bg:#0C0E12;--panel:#13161C;--panel2:#1A1E26;--line:#262B35;--text:#E7E9EE;--muted:#9AA3B2;--blue:#6CB4FF;--orange:#FFAA55;--green:#5ED3A0;--red:#FF7B6B;--yellow:#E6D06A;--onaccent:#0C0E12;--shade:rgba(4,5,8,.6)}
.app.light{--bg:#F5F6F8;--panel:#FFFFFF;--panel2:#EEF0F3;--line:#DCE0E6;--text:#14171C;--muted:#535D6D;--blue:#1C66C4;--orange:#A35200;--green:#0E7650;--red:#BF3428;--yellow:#7A6000;--shade:rgba(20,23,28,.35)}
.app *{box-sizing:border-box}

.app h1,.app h2,.app h3,.app p{margin:0}
.mono{font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.h1{font-size:24px;font-weight:600;letter-spacing:-0.01em}
.h2{font-size:15px;font-weight:600}
.sub{font-size:13px;color:var(--muted);line-height:20px}
.eyebrow{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
.nav{display:flex;align-items:center;gap:10px;width:100%;min-height:36px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:var(--muted);text-align:left;font-size:14px}
.nav:hover{background:var(--panel2);color:var(--text)}
.nav.on{background:var(--panel2);color:var(--text);font-weight:500}
.badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--orange);color:var(--onaccent);font-size:11px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.app.light .badge{color:#FFFFFF}
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.p-agent{color:var(--blue);background:color-mix(in srgb,var(--blue) 13%,transparent)}
.p-human{color:var(--orange);background:color-mix(in srgb,var(--orange) 13%,transparent)}
.p-done{color:var(--green);background:color-mix(in srgb,var(--green) 13%,transparent)}
.p-blocked{color:var(--muted);background:var(--panel2)}
.p-high{color:var(--red);background:color-mix(in srgb,var(--red) 13%,transparent)}
.p-med{color:var(--yellow);background:color-mix(in srgb,var(--yellow) 14%,transparent)}
.p-low{color:var(--blue);background:color-mix(in srgb,var(--blue) 13%,transparent)}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;border:1px solid var(--line);font-size:12px;color:var(--muted);white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-size:13px;font-weight:500;color:var(--text);text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--text);background:var(--panel2)}
.btn.sm{min-height:30px;padding:0 10px;font-size:12px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--muted)}
.icon-btn:hover{color:var(--text);border-color:var(--muted)}
.search{display:flex;align-items:center;gap:10px;min-height:36px;width:min(420px,100%);padding:0 10px 0 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:13px;text-align:left}
.search:hover{border-color:var(--muted)}
kbd{margin-left:auto;font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;padding:2px 6px;border-radius:5px;border:1px solid var(--line);color:var(--muted)}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:8px 10px;border:0;border-radius:8px;background:transparent;text-align:left;color:var(--text)}
.row:hover{background:var(--panel2)}
.row.on{background:var(--panel2);outline:1px solid var(--line)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:13px}
.chip:hover{color:var(--text)}
.chip.on{background:var(--text);border-color:var(--text);color:var(--bg)}
.bcard{display:flex;flex-direction:column;gap:8px;width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);text-align:left;color:var(--text)}
.bcard:hover{border-color:var(--muted)}
.bar{height:4px;border-radius:2px;background:var(--panel2);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:2px}
.step{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.step .dot{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-family:'Geist Mono',ui-monospace,monospace}
.step.done{color:var(--text)}
.step.done .dot{background:var(--green);border-color:var(--green);color:var(--onaccent)}
.app.light .step.done .dot{color:#FFFFFF}
.step.cur{color:var(--text);font-weight:600}
.step.cur .dot{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.doc{font-family:'Geist Mono',ui-monospace,monospace;font-size:12.5px;line-height:22px;white-space:pre-wrap}
.doc .h{color:var(--text);font-weight:500}
.doc .t{color:var(--muted)}
.doc .k{color:var(--blue)}
.doc .x{color:var(--orange)}
.term{background:#07080B;border:1px solid var(--line);border-radius:10px;padding:16px;font-family:'Geist Mono',ui-monospace,monospace;font-size:12.5px;line-height:22px;color:#C9CED8;overflow-x:auto;min-height:320px}
.term .cmd{color:#E7E9EE}
.term .dim{color:#8B93A1}
.term .ok{color:#5ED3A0}
.term .warn{color:#E6D06A}
.term .queue{color:#E6D06A}
.term .gate{color:#FFAA55}
.term .txt{color:#C9CED8;padding-left:16px}
.caret{display:inline-block;width:8px;height:15px;background:#C9CED8;vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.diff{font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;line-height:20px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.diff .m{padding:2px 10px;color:var(--red);background:color-mix(in srgb,var(--red) 9%,transparent)}
.diff .p{padding:2px 10px;color:var(--green);background:color-mix(in srgb,var(--green) 9%,transparent)}
.tile{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);text-align:left;color:var(--text);width:100%}
.tile:hover{border-color:var(--muted)}
.tab{min-height:32px;padding:0 12px;border:0;border-radius:6px;background:transparent;color:var(--muted);font-size:13px}
.tab.on{background:var(--panel2);color:var(--text);font-weight:500}
.toggle{width:40px;height:24px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);position:relative;flex:none}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:left .15s}
.toggle.on{background:var(--accent);border-color:var(--accent)}
.toggle.on::after{left:19px;background:var(--onaccent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.overlay{position:fixed;inset:0;background:var(--shade);display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px;z-index:50}
.pal-in{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--text);font:inherit;font-size:15px;padding:16px 18px;outline:none}
.dg{position:absolute;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;font-size:13px;line-height:18px;color:var(--text)}
.dg .s{color:var(--muted);font-size:12px}
.app{background:radial-gradient(1200px 600px at 85% -10%,color-mix(in srgb,var(--accent) 10%,transparent),transparent 60%),radial-gradient(900px 500px at -10% 110%,color-mix(in srgb,var(--blue) 9%,transparent),transparent 60%),var(--bg)!important;--glass:color-mix(in srgb,var(--panel) 70%,transparent);--shadow:0 1px 0 rgba(255,255,255,.04) inset,0 10px 30px rgba(0,0,0,.28)}
.app.light{--shadow:0 1px 0 rgba(255,255,255,.7) inset,0 8px 24px rgba(20,23,28,.08)}
.card,.dg,.overlay>.card{background:var(--glass);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);box-shadow:var(--shadow);border-radius:8px}
.bcard{background:var(--glass);backdrop-filter:blur(10px);box-shadow:var(--shadow);border-radius:8px}
.bcard:hover,.card.hover:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.btn,.row,.icon-btn,.search,.tab,.diff{border-radius:6px}
.tag{border-radius:4px}.term{border-radius:8px;box-shadow:var(--shadow)}
.btn.primary{box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 30%,transparent);font-weight:600}
#nav{background:var(--glass)!important;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.app header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 65%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.overlay{backdrop-filter:blur(4px)}
.app .h1{font-weight:700}.app .h2{font-weight:700}.app .eyebrow{font-weight:600}
.app header{padding:14px 28px}
.app main{padding:28px}
#menu{display:none}
#nav{position:sticky;top:0;height:100vh;overflow-y:auto}
.split{display:grid;grid-template-columns:minmax(220px,1fr) 2fr;gap:20px;align-items:start}
.split-b{grid-template-columns:minmax(260px,1fr) 1.4fr}
.board{display:grid;grid-template-columns:repeat(8,minmax(160px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.board>div{scroll-snap-align:start}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.diagram{position:relative;height:300px;overflow:auto;padding:0}
.canvas{position:relative;width:760px;height:260px}
.row{flex-wrap:wrap;row-gap:4px}
.h1{overflow-wrap:anywhere}
.mono{overflow-wrap:anywhere}
@media (max-width:900px){
 #menu{display:inline-flex}
 #nav{position:fixed;top:0;left:0;bottom:0;width:min(280px,84vw);z-index:60;transform:translateX(-105%);transition:transform .2s ease;box-shadow:var(--shadow);visibility:hidden}
 #nav.open{transform:none;visibility:visible}
 #scrim{position:fixed;inset:0;background:var(--shade);z-index:55;backdrop-filter:blur(2px)}
 .split,.split-b{grid-template-columns:1fr}
}
@media (max-width:640px){
 .chips{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:2px 16px 4px;scrollbar-width:none}
 .chips>*{flex:none}
 .row.stack{display:grid;grid-template-columns:64px 1fr;gap:4px 10px;align-items:start}
 .row.stack>.pill{grid-column:2;justify-self:start}
 .row.stack2{flex-direction:column;align-items:flex-start;gap:4px}
 .diagram{height:auto;overflow:visible}
 .canvas{width:auto;height:auto;display:flex;flex-direction:column;gap:10px;padding:14px}
 .canvas .dg{position:static}
 .app header>span.pill{display:none}
 .app header{padding:10px 16px;gap:8px;flex-wrap:nowrap}
 .app header .pill{max-width:42vw;overflow:hidden;text-overflow:ellipsis}
 .hide-sm{display:none}
 .search{width:40px;min-width:40px;padding:0;justify-content:center}
 .app main{padding:16px;gap:14px}
 .h1{font-size:20px}
 .card{padding:14px}
 .btn,.btn.sm,.chip,.tab,.row,.icon-btn,.search{min-height:44px}
 .icon-btn{width:44px;height:44px}
 .board{grid-template-columns:repeat(8,78vw)}
 .term{font-size:11.5px;line-height:19px;min-height:220px;padding:12px}
 .diff{font-size:11px}
 .overlay{padding:8vh 12px 12px}
 .actions .btn{flex:1 1 auto}
}
@media (prefers-reduced-motion:reduce){#nav{transition:none}}
.app :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
</style>

<div class="card"><h2 class="h2">Models per tier</h2>${['fast','balanced','deep'].map(t=>`<div class="row"><span style="width:90px">${t}</span><span class="mono">${model(t)}</span></div>`).join('')}</div>
<div class="card"><h2 class="h2">Project</h2><div class="row"><span style="width:120px">Language</span><span class="mono">en</span></div><div class="row"><span style="width:120px">ID prefix</span><span class="mono">AP</span></div><div class="row"><span style="width:120px">Owner</span><span class="mono">Alberto Galimberti</span></div><div class="row"><span style="width:120px">Theme</span><button class="btn sm" data-theme="1">Toggle ${S.theme==='dark'?'light':'dark'}</button></div></div>`}
const R={overview:renderOverview,plan:renderPlan,backlog:renderBacklog,story:renderStory,approvals:renderApprovals,runs:renderRuns,insights:renderInsights,architecture:renderArchitecture,journal:renderJournal,settings:renderSettings};
function render(){$('#app').classList.toggle('light',S.theme==='light');renderNav();$('#main').innerHTML=R[S.screen]()}
// palette
const cmds=()=>SCREENS.map(([k,n])=>({l:'Go to '+n,f:()=>go(k)})).concat(STORIES.map(s=>({l:s.id+' '+s.title,f:()=>open(s.id)})),[{l:'Run '+nextStep().cmd,f:()=>launch(nextStep().cmd)},{l:'Run make check',f:()=>launch('make check')},{l:'Toggle theme',f:()=>{S.theme=S.theme==='dark'?'light':'dark';closePal();render()}}]);
let pi=0,pf=[];
function palList(){const q=$('#palq').value.toLowerCase();pf=cmds().filter(c=>c.l.toLowerCase().includes(q));pi=Math.min(pi,Math.max(pf.length-1,0));$('#pall').innerHTML=pf.map((c,i)=>`<button class="row${i===pi?' on':''}" data-pc="${i}">${esc(c.l)}</button>`).join('')||'<p class="sub" style="padding:10px">No results.</p>'}
function openPal(){lastFocus=document.activeElement;$('#pal').hidden=false;$('#palq').value='';pi=0;palList();$('#palq').focus()}
function closePal(){if(!$('#pal').hidden){$('#pal').hidden=true;lastFocus&&lastFocus.focus&&lastFocus.focus()}}
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#pal').hidden?openPal():closePal();return}
if(e.key==='Escape'&&$('#nav').classList.contains('open')){setNav(false);$('#menu').focus();return}
if($('#pal').hidden)return;if(e.key==='Escape')closePal();if(e.key==='ArrowDown'){e.preventDefault();pi=Math.min(pi+1,pf.length-1);palList()}if(e.key==='ArrowUp'){e.preventDefault();pi=Math.max(pi-1,0);palList()}if(e.key==='Enter'&&pf[pi]){const f=pf[pi].f;$('#pal').hidden=true;f()}});
$('#palq').addEventListener('input',()=>{pi=0;palList()});
document.addEventListener('click',e=>{const t=e.target.closest('[data-go],[data-open],[data-launch],[data-approve],[data-sendback],[data-filter],[data-view],[data-run],[data-cat],[data-find],[data-tab],[data-j],[data-cli],[data-theme],[data-diff],[data-cancel],[data-group],[data-src],[data-contract],[data-scan],[data-pc],#openPal,#theme');if(e.target.closest('#menu'))return setNav(true);if(e.target.id==='scrim')return setNav(false);
if(!t){if(e.target.id==='pal')closePal();return}
const d=t.dataset;if(t.id==='openPal')return openPal();if(t.id==='theme'||d.theme){S.theme=S.theme==='dark'?'light':'dark';return render()}
if(d.pc!==undefined){const f=pf[+d.pc].f;$('#pal').hidden=true;return f()}
if(d.go)return go(d.go);if(d.open)return open(d.open);if(d.launch)return launch(d.launch);
if(d.approve){S.approved[d.approve]=true;announce('Approved and written to the artifact');return render()}
if(d.sendback){S.sentBack[d.sendback]=true;announce('Changes requested');return render()}
if(d.filter){S.filter=d.filter}else if(d.view){S.view=d.view}else if(d.run){S.selRun=+d.run}else if(d.cat){S.cat=d.cat}else if(d.find){S.selF=d.find}else if(d.tab){S.tab=d.tab}else if(d.j){S.journalSel=+d.j}else if(d.cli){S.cli=d.cli}else if(d.diff){S.diffOpen[d.diff]=!S.diffOpen[d.diff]}else if(d.cancel){return cancel(+d.cancel)}else if(d.scan){S.err=true}else if(d.group){S.group=d.group}else if(d.src){S.src=d.src}else if(d.contract){S.contract=S.contract==='ok'?'mismatch':'ok'}
render()});
render();
</script>
</body>
</html>
